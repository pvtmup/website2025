<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0b0b16" />
  <title>СТЭК — башня в один тап</title>
  <meta name="description" content="СТЭК — гипер-казуальная башня в один тап. Дневной челлендж, дуэли с друзьями по ссылке, скины. Один сид у всех — сравнивайся честно." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="СТЭК 🧱 — побей мой результат" />
  <meta property="og:description" content="Башня в один тап. Та же башня по ссылке — попробуй обогнать!" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css?v=2" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div class="bg-glow g1"></div>
  <div class="bg-glow g2"></div>

  <main id="app" class="frame">
    <div id="game-wrap">
      <canvas id="game"></canvas>
      <div id="hud" class="hidden">
        <div class="hud-score">0</div>
        <div class="hud-combo"></div>
        <div class="hud-hint">тап — поставить блок</div>
        <div id="coach" class="coach hidden">Тапни, чтобы поставить блок 👆</div>
      </div>
    </div>
    <div id="overlay"></div>
    <button id="lang" aria-label="язык">🌐</button>
    <button id="mute" aria-label="звук">🔊</button>
  </main>

  <div id="toast" class="toast"></div>

  <script src="js/tg.js?v=2"></script>
  <script src="js/i18n.js?v=2"></script>
  <script src="js/rng.js?v=2"></script>
  <script src="js/skins.js?v=2"></script>
  <script src="js/store.js?v=2"></script>
  <script src="js/audio.js?v=2"></script>
  <script src="js/game.js?v=2"></script>
  <script src="js/share.js?v=2"></script>
  <script src="js/quests.js?v=2"></script>
  <script src="js/season.js?v=2"></script>
  <script src="js/ui.js?v=2"></script>
  <script src="js/app.js?v=2"></script>
</body>
</html>
