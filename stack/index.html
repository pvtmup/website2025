<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0b0b16" />
  <title>СТЭК — башня в один тап</title>
  <meta name="description" content="СТЭК — гипер-казуальная башня в один тап. Дневной челлендж, дуэли с друзьями по ссылке, скины. Один сид у всех — сравнивайся честно." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div class="bg-glow g1"></div>
  <div class="bg-glow g2"></div>

  <main id="app" class="frame">
    <div id="game-wrap">
      <canvas id="game"></canvas>
      <div id="hud" class="hidden">
        <div class="hud-score">0</div>
        <div class="hud-combo"></div>
        <div class="hud-hint">тап — поставить блок</div>
      </div>
    </div>
    <div id="overlay"></div>
    <button id="mute" aria-label="звук">🔊</button>
  </main>

  <div id="toast" class="toast"></div>

  <script src="js/tg.js"></script>
  <script src="js/rng.js"></script>
  <script src="js/skins.js"></script>
  <script src="js/store.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/game.js"></script>
  <script src="js/share.js"></script>
  <script src="js/quests.js"></script>
  <script src="js/season.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
